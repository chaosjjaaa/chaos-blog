---
layout: default
---

<main class="container article-layout">
  <article class="article">
    {% if page.categories and page.categories.size > 0 %}
      <p class="tag">{{ page.categories | first }}</p>
    {% endif %}

    <h1>{{ page.title }}</h1>
    <p class="meta">
      {{ page.date | date: "%Y-%m-%d" }}{% if page.description %} · {{ page.description }}{% endif %}
    </p>

    {{ content }}

    {% include backlinks.html %}

    <p class="back-link">
      <a class="read-more" href="{{ '/' | relative_url }}">← 返回首页</a>
    </p>
  </article>
</main>
