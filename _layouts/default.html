<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
{% include head.html %}
<body>
  <aside class="site-sidebar" aria-label="文章分区">
    <a class="sidebar-brand" href="{{ '/' | relative_url }}">Chaos Blog</a>
    <div class="sidebar-scroll">
      <nav class="sidebar-nav sidebar-primary" aria-label="主页导航">
        <a {% if page.url == '/' %}class="active"{% endif %} href="{{ '/' | relative_url }}">主页</a>
      </nav>

      <p>分区</p>
      <nav class="sidebar-nav" aria-label="分区导航">
        <a {% if page.section_key == 'math' or page.section == 'math' %}class="active"{% endif %} href="{{ '/sections/math.html' | relative_url }}">数学笔记</a>
        <a {% if page.section_key == 'poem' or page.section == 'poem' %}class="active"{% endif %} href="{{ '/sections/poem.html' | relative_url }}">诗歌</a>
        <a {% if page.section_key == 'project' or page.section == 'project' %}class="active"{% endif %} href="{{ '/sections/project.html' | relative_url }}">项目</a>
        <a {% if page.section_key == 'misc' or page.section == 'misc' %}class="active"{% endif %} href="{{ '/sections/misc.html' | relative_url }}">随笔</a>
        <a {% if page.section_key == 'other' or page.section == 'other' %}class="active"{% endif %} href="{{ '/sections/other.html' | relative_url }}">其他</a>
      </nav>
    </div>
  </aside>

  {% include header.html %}

  {{ content }}

  {% include footer.html %}
  {% include scripts.html %}
</body>
</html>
