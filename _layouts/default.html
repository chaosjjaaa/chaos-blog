<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
  <style>
    .article blockquote {
      margin: 18px 0;
      padding: 16px 18px;
      border-left: 4px solid #d6b36a;
      border-radius: 14px;
      background: #f9efd9;
      font-size: 16px;
      font-weight: 400;
      text-align: left;
    }

    .article blockquote p {
      margin: 0.35em 0;
    }

    .article h2 {
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.25;
    }

    .article h3 {
      margin-top: 28px;
      font-size: 22px;
    }

    .article mjx-container {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .footer-tagline {
      margin-bottom: 14px;
      color: #526071;
    }

    .footer-tagline strong {
      display: block;
      color: #243042;
      font-size: 18px;
    }

    .footer-tagline p {
      margin: 4px 0 0;
    }

    @media (max-width: 720px) {
      .home-posts.section {
        padding: 28px 0;
      }

      .home-posts h2 {
        margin-bottom: 12px;
        font-size: 22px;
      }

      .home-posts .card-grid {
        gap: 10px;
      }

      .home-posts .card {
        padding: 14px 16px;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(36, 48, 66, 0.045);
      }

      .home-posts .card h3 {
        margin: 2px 0 6px;
        font-size: 17px;
        line-height: 1.35;
      }

      .home-posts .card p {
        margin: 6px 0;
        font-size: 14px;
        line-height: 1.55;
      }

      .home-posts .card .tag {
        margin-bottom: 4px;
        padding: 2px 8px;
        font-size: 12px;
      }

      .home-posts .card .meta {
        margin-top: 8px;
        font-size: 12px;
      }

      .home-posts .card > a:last-child {
        display: inline-block;
        margin-top: 2px;
        font-size: 14px;
      }

      .footer-tagline {
        margin-bottom: 10px;
        font-size: 14px;
      }

      .footer-tagline strong {
        font-size: 16px;
      }
    }
  </style>
  {% if page.mathjax %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"], ["$", "$"]],
        displayMath: [["\\[", "\\]"], ["$$", "$$"]]
      },
      svg: { fontCache: "global" }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="{{ '/' | relative_url }}">Chaos Blog</a>
      <nav>
        <a href="{{ '/' | relative_url }}">主页</a>
        <a href="{{ '/search.html' | relative_url }}">文章</a>
        <a href="{{ '/about.html' | relative_url }}">关于</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="container">
      {% if page.url == '/' %}
        <div class="footer-tagline">
          <strong>Chaos的博客</strong>
          <p>记录学习、项目和思考。</p>
        </div>
      {% endif %}
      <p>© 2026 Chaos Blog. Powered by GitHub Pages + Jekyll.</p>
    </div>
  </footer>

  <script defer src="{{ '/blog-data.js' | relative_url }}"></script>
  <script defer src="{{ '/blog.js' | relative_url }}"></script>
</body>
</html>
