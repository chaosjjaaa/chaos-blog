<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
  <style>
    .article blockquote {
      margin: 18px 0;
      padding: 16px 18px;
      border-left: 4px solid #d6b36a;
      border-radius: 14px;
      background: #f9efd9;
      font-size: 16px;
      font-weight: 400;
      text-align: left;
    }

    .article blockquote p {
      margin: 0.35em 0;
    }

    .article h2 {
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.25;
    }

    .article h3 {
      margin-top: 28px;
      font-size: 22px;
    }

    .article mjx-container {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }
  </style>
  {% if page.mathjax %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"], ["$", "$"]],
        displayMath: [["\\[", "\\]"], ["$$", "$$"]]
      },
      svg: { fontCache: "global" }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="{{ '/' | relative_url }}">Chaos Blog</a>
      <nav>
        <a href="{{ '/' | relative_url }}">主页</a>
        <a href="{{ '/search.html' | relative_url }}">搜索</a>
        <a href="{{ '/about.html' | relative_url }}">关于</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Chaos Blog. Powered by GitHub Pages + Jekyll.</p>
    </div>
  </footer>

  <script src="{{ '/blog-data.js' | relative_url }}"></script>
  <script src="{{ '/blog.js' | relative_url }}"></script>
</body>
</html>
