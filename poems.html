    <h1>诗词摘抄</h1>
    <p class="lead">这里收集几首适合练习排版的古诗。你可以把它当作博客列表页，也可以继续改成自己的文章归档页。</p>

    <article class="poem-card">
      <h2>静夜思</h2>
      <p class="author">李白</p>
      <div class="poem-text">
        <p>床前明月光，疑是地上霜。</p>
        <p>举头望明月，低头思故乡。</p>
      </div>
      <a class="read-more" href="posts/jingyesi.html">阅读小记 →</a>
    </article>

    <article class="poem-card" id="spring">
      <h2>春晓</h2>
      <p class="author">孟浩然</p>
      <div class="poem-text">
        <p>春眠不觉晓，处处闻啼鸟。</p>
        <p>夜来风雨声，花落知多少。</p>
      </div>
    </article>

    <article class="poem-card">
      <h2>登鹳雀楼</h2>
      <p class="author">王之涣</p>
      <div class="poem-text">
        <p>白日依山尽，黄河入海流。</p>
        <p>欲穷千里目，更上一层楼。</p>
      </div>
    </article>

    <article class="poem-card">
      <h2>江雪</h2>
      <p class="author">柳宗元</p>
      <div class="poem-text">
        <p>千山鸟飞绝，万径人踪灭。</p>
        <p>孤舟蓑笠翁，独钓寒江雪。</p>
      </div>
    </article>

    <article class="poem-card">
      <h2>题西林壁</h2>
      <p class="author">苏轼</p>
      <div class="poem-text">
        <p>横看成岭侧成峰，远近高低各不同。</p>
        <p>不识庐山真面目，只缘身在此山中。</p>
      </div>
    </article>
