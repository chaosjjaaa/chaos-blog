<aside class="site-sidebar" aria-label="文章分区">
  <a class="sidebar-brand" href="{{ '/' | relative_url }}">Chaos Blog</a>
  <div class="sidebar-scroll">
    <nav class="sidebar-nav sidebar-primary" aria-label="主页导航">
      <a {% if page.url == '/' %}class="active"{% endif %} href="{{ '/' | relative_url }}">主页</a>
    </nav>

    <p>分区</p>
    <nav class="sidebar-nav" aria-label="分区导航">
      {% for section_pair in site.data.sections %}
        {% assign section_key = section_pair[0] %}
        {% assign section = section_pair[1] %}
        <a {% if page.section_key == section_key or page.section == section_key %}class="active"{% endif %} href="{{ '/sections/' | append: section_key | append: '.html' | relative_url }}">{{ section.title }}</a>
      {% endfor %}
    </nav>
  </div>
</aside>
